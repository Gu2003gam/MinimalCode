<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="logo">Your logo</h1>
            <h2>Login</h2>
            <form>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                <button type="submit" class="sign-in-btn">Sign in</button>
            </form>
            <div class="social-login">
                <p>or log in with</p>
                <div class="social-icons">
                    <button class="social-btn google">G</button>
                    <button class="social-btn github">GitHub</button>
                    <button class="social-btn facebook">F</button>
                </div>
            </div>
            <p class="register-link">Don't have an account? Register for free.</p>
        </div>
    </div>
</body>
</html>
