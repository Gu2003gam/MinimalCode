<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="Cadastro.css">
</head>
<body>
    <form action="#" method="get" id="cadastro-form">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite o seu nome...">
        <span id="nome-error" class="error-message"></span>

        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" placeholder="Digite o seu nome de usuário...">
        <span id="usuario-error" class="error-message"></span>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite a sua senha...">
        <span id="senha-error" class="error-message"></span>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Digite o seu e-mail...">
        <span id="email-error" class="error-message"></span>

        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" placeholder="Digite a sua data de nascimento...">
        <span id="nascimento-error" class="error-message"></span>

        <input type="submit" value="Cadastrar" id="botao">

        <p id="success-message" class="success-message"></p>
    </form>
    <script src="Cadastro.js"></script>
</body>
</html>
